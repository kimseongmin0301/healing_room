<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>힐링룸</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- 로비: 방 목록 -->
  <section id="lobby" class="lobby" hidden>
    <header class="lobby-head">
      <div>
        <h1>힐링룸</h1>
        <p>마음에 드는 방에 들어가 멍하니 쉬어 가세요</p>
      </div>
      <button id="create-open" class="btn primary big">방 만들기</button>
    </header>
    <p id="lobby-msg" class="msg"></p>
    <div id="room-grid" class="room-grid"></div>

    <!-- 방 만들기 -->
    <div id="create-dialog" class="dialog-backdrop" hidden>
      <form id="create-form" class="dialog panel" novalidate>
        <h2>방 만들기</h2>
        <label class="field">
          <span>방 이름</span>
          <input id="create-name" maxlength="30" placeholder="새벽 작업방" autocomplete="off">
        </label>
        <div class="field">
          <span>테마</span>
          <div id="theme-picker" class="theme-picker" role="radiogroup"></div>
        </div>
        <p class="hint-text">방을 만든 사람이 방장이 돼요. 방장이 나가면 그다음에 들어온 사람이 방장이 되고, 아무도 없는 채로 30분이 지나면 방이 닫혀요.</p>
        <p id="create-msg" class="msg error"></p>
        <div class="dialog-actions">
          <button type="button" id="create-cancel" class="btn">취소</button>
          <button class="btn primary">만들기</button>
        </div>
      </form>
    </div>
  </section>

  <!-- 방 -->
  <section id="room" hidden>
    <div class="ui top-left">
      <button id="back" class="chip">← 로비</button>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <p class="presence"><span class="dot"></span><span id="presence-text">연결 중…</span>
        <span id="host-chip" class="tag mine" hidden title="재생을 멈추거나 옮기고, 아무 곡이나 넘기거나 순서를 바꿀 수 있어요">내가 방장</span></p>
      <button id="presence-toggle" class="chip people-chip" type="button" aria-expanded="false" aria-controls="people">
        👥 함께 있는 사람 <b id="people-chip-count">0</b> <span class="caret">▾</span></button>
      <!-- 기본 방의 방장에게만 보임: 지난 신청곡·채팅·통계 지우기 -->
      <button id="reset-room" class="chip reset-chip" type="button" hidden
              title="이 방의 지난 신청곡, 투표, 채팅을 모두 지우고 기본 음악부터 다시 틀어요">🧹 기록 초기화</button>
      <!-- 함께 있는 사람 (닉네임, 가린 IP) -->
      <div id="people" class="panel people" hidden>
        <div class="panel-head">함께 있는 사람 <b id="people-count">0</b>명</div>
        <ol id="people-list" class="people-list"></ol>
        <p class="hint-text">IP는 앞부분만 보여요</p>
      </div>
    </div>

    <div class="ui top-right">
      <p id="hint" class="hint"></p>
      <div class="panel mixer">
        <div class="panel-head">환경음</div>
        <p id="mixer-note" class="mixer-note" hidden>음악이 나오는 동안 쉬고 있어요</p>
        <div id="mixer-list"></div>
      </div>
    </div>

    <div class="ui panel music" id="music">
      <div class="music-head">
        <span class="music-head-title">함께 듣는 음악</span>
        <span id="mini-title" class="mini-title"></span>
        <span class="win-buttons">
          <button id="music-min" class="win" type="button" title="최소화">▁</button>
          <button id="music-max" class="win" type="button" title="최대화">□</button>
        </span>
      </div>

      <div id="music-body" class="music-body">
        <!-- 영상 위를 투명한 막으로 덮어 일시정지·탐색 같은 직접 조작을 막는다 (모두 같은 곡을 같은 위치로 듣기 위해) -->
        <div class="player"><div id="yt-player"></div><div class="player-shield" aria-hidden="true"></div></div>
        <!-- 재생 위치: 모두에게 보이고, 방장만 멈춤·이동 가능 -->
        <div class="progress">
          <button id="host-toggle" class="win" type="button" hidden title="모두 멈춤">❚❚</button>
          <span id="time-now">0:00</span>
          <input id="seek" type="range" min="0" max="100" step="1" value="0" disabled aria-label="재생 위치">
          <span id="time-total">0:00</span>
        </div>
        <div class="now">
          <div class="now-meta">
            <span id="now-tag" class="tag"></span>
            <p id="now-title">음악을 불러오는 중…</p>
          </div>
          <button id="now-vote" class="btn" hidden></button>
        </div>
        <label class="volume">
          <span>음악 볼륨</span>
          <input id="music-volume" type="range" min="0" max="100" step="1" value="70">
          <output id="music-volume-out">70</output>
        </label>

        <div class="tabs" role="tablist">
          <button class="tab on" data-tab="queue" role="tab">다음 곡 <b id="queue-count">0</b></button>
          <button class="tab" data-tab="history" role="tab">지난 신청곡</button>
          <button class="tab" data-tab="recommend" role="tab">추천</button>
        </div>
        <ol id="queue-list" class="list"></ol>
        <ol id="history-list" class="list" hidden></ol>
        <div id="recommend-list" class="list" hidden></div>

        <form id="add-form" class="add">
          <input id="add-url" placeholder="YouTube 링크를 붙여넣어 신청하기" autocomplete="off" required>
          <button class="btn primary">신청</button>
        </form>
        <p id="music-msg" class="msg" role="status"></p>
      </div>
    </div>

    <!-- 채팅 -->
    <div class="ui panel chat" id="chat">
      <div class="chat-head">
        <span class="chat-title">채팅</span>
        <b id="chat-unread" class="badge" hidden></b>
        <button id="chat-nick" class="link chat-nick" type="button" title="닉네임 바꾸기"></button>
        <form id="chat-nick-form" class="chat-nick-form" hidden>
          <input id="chat-nick-input" maxlength="12" autocomplete="off" aria-label="새 닉네임">
          <button class="btn" type="submit">저장</button>
        </form>
        <button id="chat-toggle" class="win" type="button" title="접기">▁</button>
      </div>
      <div id="chat-body" class="chat-body">
        <ol id="chat-list" class="chat-list" aria-live="polite"></ol>
        <form id="chat-form" class="add">
          <input id="chat-input" maxlength="300" placeholder="메시지 보내기" autocomplete="off">
          <button class="btn primary">보내기</button>
        </form>
        <p id="chat-msg" class="msg" role="status"></p>
      </div>
    </div>

    <div class="ui controls">
      <button id="music-sound" class="chip">음악 켜기</button>
      <button id="ambient-sound" class="chip">환경음 켜기</button>
      <button id="fx" class="chip">효과 끄기</button>
    </div>
  </section>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
