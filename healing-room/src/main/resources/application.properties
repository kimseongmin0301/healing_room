spring.application.name=healing-room

# 프로젝트 폴더의 .env 를 읽는다 (같은 이름의 OS 환경변수가 있으면 그 값이 우선)
spring.config.import=optional:file:.env[.properties]

# 환경변수 PORT가 있으면 그 포트로, 없으면 8080
server.port=${PORT:8080}
# 에러 응답에 스택 트레이스(서버 내부 정보)를 넣지 않는다
server.error.include-stacktrace=never

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA =====
# 실행 시 DB를 절대 만들거나 바꾸지 않는다. validate 는 엔티티와 테이블이 맞는지 확인만 한다.
# 스키마 변경은 db/ 폴더의 SQL 을 직접 실행한다.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:1}

# Redis 를 다른 서비스와 같이 쓰므로 모든 키 앞에 붙인다
healing-room.redis.key-prefix=healing-room:
# 이 시간(초) 동안 신호가 없으면 방에서 나간 것으로 본다
healing-room.presence.timeout-seconds=45
