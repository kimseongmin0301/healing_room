spring.application.name=healing-room

# 프로젝트 폴더의 .env 를 읽는다 (같은 이름의 OS 환경변수가 있으면 그 값이 우선)
spring.config.import=optional:file:.env[.properties]

# 환경변수 PORT가 있으면 그 포트로, 없으면 18280 (운영 서버와 같은 포트. 8080 은 다른 서비스와 겹치기 쉬워 피함)
server.port=${PORT:18280}
# 에러 응답에 스택 트레이스(서버 내부 정보)를 넣지 않는다
server.error.include-stacktrace=never

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA =====
# 실행 시 DB를 절대 만들거나 바꾸지 않는다. validate 는 엔티티와 테이블이 맞는지 확인만 한다.
# 스키마 변경은 db/ 폴더의 SQL 을 직접 실행한다.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# ===== 함께 듣는 음악 =====
# 영상이 끝난 뒤 다음 곡으로 넘어가기까지 여유 시간(초)
healing-room.queue.end-grace-seconds=2
# 방 하나의 대기열 최대 곡 수 (안전장치)
healing-room.queue.max-size=100

# ===== 방 =====
# 아무도 없이 이 시간(분)이 지나면 방을 닫는다 (기본 방은 닫지 않음)
healing-room.room.idle-close-minutes=30
# 한 사람이 동시에 열어 둘 수 있는 방 수
healing-room.room.max-open-per-visitor=3

# ===== YouTube 추천 (YouTube Data API v3) =====
# 키가 없으면 "비슷한 영상" 추천만 꺼지고 나머지는 동작한다
healing-room.youtube.api-key=${YOUTUBE_API_KEY:}
# 같은 곡의 검색 결과를 다시 쓰는 시간 (검색 1번 = 하루 할당량 10,000 중 100)
healing-room.youtube.search-cache-hours=12

# ===== Redis (채팅) =====
# 다른 서비스와 같은 Redis 를 쓰므로 전용 계정(~healing-room:*)과 DB 1번, 키 접두어를 지킨다
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:1}
spring.data.redis.timeout=3s
healing-room.redis.key-prefix=healing-room:

# ===== 채팅 =====
# 방마다 보관하는 최근 메시지 수
healing-room.chat.history-size=100
# 기본 방은 이 시간(시간) 안의 메시지만 보여준다. 사용자 방은 방이 닫힐 때 지운다
healing-room.chat.default-room-retention-hours=24
# 도배 방지: window-seconds 동안 한 사람이 보낼 수 있는 메시지 수
healing-room.chat.rate-limit=6
healing-room.chat.rate-window-seconds=10
