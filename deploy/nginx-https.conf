# /etc/nginx/sites-available/healing.kimseongmin.co.kr (2단계: 인증서 받은 뒤)
# 앱은 127.0.0.1:18280 에서만 열려 있고, nginx 가 HTTPS 와 WebSocket 을 받아 넘겨준다.
server {
    listen 80;
    listen [::]:80;
    server_name healing.kimseongmin.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name healing.kimseongmin.co.kr;

    ssl_certificate /etc/letsencrypt/live/healing.kimseongmin.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/healing.kimseongmin.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    # YouTube 플레이어가 동작하려면 다른 사이트에도 출처(origin)는 보내야 한다
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 실시간 연결 (방 접속, 음악 상태, 채팅). 오래 열려 있으므로 시간 제한을 넉넉하게
    location /ws/ {
        proxy_pass http://127.0.0.1:18280;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:18280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
