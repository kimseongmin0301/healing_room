# /etc/nginx/sites-available/healing.kimseongmin.co.kr (1단계: 인증서 받기 전)
# 인증서 발급(ACME) 요청만 받고 나머지는 HTTPS 로 보낸다. 기존 kimseongmin.co.kr 설정과는 별개 파일이다.
server {
    listen 80;
    listen [::]:80;
    server_name healing.kimseongmin.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
